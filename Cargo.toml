[workspace]
members = [
    "src/codecs/*",
    "src/common",
    "src/core",
    "src/datasource",
    "src/infinitier_explorer",
    "src/fs",
    "src/test_utils",
    "src/importers/*",
    "src/resources/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.4"
license = "GPL-3.0-or-later"
authors = ["Francesco Cina <ufoscout@gmail.com>"]
homepage = "https://github.com/ufoscout/infinitier"
repository = "https://github.com/ufoscout/infinitier"

[workspace.dependencies]
# Codecs
infinitier_acm_decoder = { path = "src/codecs/acm_decoder", version = "0.0.4" }
infinitier_acm_encoder = { path = "src/codecs/acm_encoder", version = "0.0.4"  }
infinitier_bik_decoder = { path = "src/codecs/bik_decoder", version = "0.0.4"  }
infinitier_mve_decoder = { path = "src/codecs/mve_decoder", version = "0.0.4"  }
infinitier_mve_encoder = { path = "src/codecs/mve_encoder", version = "0.0.4"  }
infinitier_wav_decoder = { path = "src/codecs/wav_decoder", version = "0.0.4"  }
infinitier_wbm_decoder = { path = "src/codecs/wbm_decoder", version = "0.0.4"  }

# Core
infinitier_common = { path = "src/common", version = "0.0.4" }
infinitier_core = { path = "src/core", version = "0.0.4"  }
infinitier_datasource = { path = "src/datasource", version = "0.0.4"  }
infinitier_fs = { path = "src/fs", version = "0.0.4"  }
infinitier_test_utils = { path = "src/test_utils" }

# Importers
infinitier_bam_importer = { path = "src/importers/bam_importer", version = "0.0.4"  }
infinitier_bif_importer = { path = "src/importers/bif_importer", version = "0.0.4"  }
infinitier_bmp_importer = { path = "src/importers/bmp_importer", version = "0.0.4"  }
infinitier_ids_importer = { path = "src/importers/ids_importer", version = "0.0.4"  }
infinitier_ini_importer = { path = "src/importers/ini_importer", version = "0.0.4"  }
infinitier_key_importer = { path = "src/importers/key_importer", version = "0.0.4"  }
infinitier_two_da_importer = { path = "src/importers/two_da_importer", version = "0.0.4"  }

# Resources (read + write)
infinitier_bcs_resource = { path = "src/resources/bcs", version = "0.0.4"  }
infinitier_pvrz_resource = { path = "src/resources/pvrz", version = "0.0.4"  }
infinitier_wed_resource = { path = "src/resources/wed", version = "0.0.4"  }

bitflags = { version = "2", features = ["serde"] }
bytesize = "2"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
env_logger = "0.11"
flate2 = "1"
hound = "3"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
itertools = "0.14"
log = "0.4"
parking_lot = "0.12"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis"] }
tempfile = "3"
thiserror = "2"

# This is used to decode DDS image content into the PVR files.
# We can switch to image-extras when this PR is merged: https://github.com/image-rs/image-extras/pull/16
texture2ddecoder = "0.1"

# BC1/BC3 (DXT1/DXT5) encoder used to write PVR files back from a decoded
# ImageBuffer. Pure Rust port of libsquish.
texpresso = "2"

# Audio playback
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3"] }

# WBM (= WebM) decode pipeline. See src/codecs/wbm_decoder.
matroska-demuxer = "0.7"
oxideav-vp8 = "0.1.12"
oxideav-core = "0.1"

# UI
eframe = { version = "0.34", features = ["wgpu"] }  # use wgpu backend instead of glow
egui_extras = "0.34"   # extra widgets: tables, date pickers, image loading
egui_ltreeview = "0.7"


[profile.dev]
debug = "line-tables-only"

# Set the settings for all dependencies (but not this crate itself or any workspace member).
# This includes build dependencies.
# Level range is from 0 (default for dev) to 3 (default for release)
[profile.dev.package."*"]
opt-level = 2

# Set the settings for build scripts and proc-macros.
[profile.dev.build-override]
opt-level = 2

# Workspace-member overrides: the `"*"` glob above does *not* match
# workspace members, so the codec crates would otherwise build at
# opt-level 0 in dev/test mode. Encoding/decoding is hot CPU code
# (per-pixel loops, motion search) and is unusably slow unoptimised,
# so force opt-level 2 here. List per crate — Cargo has no glob
# selector for workspace members.
[profile.dev.package.infinitier_acm_decoder]
opt-level = 2
[profile.dev.package.infinitier_acm_encoder]
opt-level = 2
[profile.dev.package.infinitier_bik_decoder]
opt-level = 2
[profile.dev.package.infinitier_mve_decoder]
opt-level = 2
[profile.dev.package.infinitier_mve_encoder]
opt-level = 2
[profile.dev.package.infinitier_wav_decoder]
opt-level = 2
[profile.dev.package.infinitier_wbm_decoder]
opt-level = 2
# The third-party VP8 decoder also runs per-pixel hot loops; force
# opt-level 2 for it in dev/test for the same reason as the in-tree
# codec crates.
[profile.dev.package.oxideav-vp8]
opt-level = 2

