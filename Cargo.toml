[workspace]
members = [
    "src/codecs/*",
    "src/common",
    "src/core",
    "src/datasource",
    "src/infinitier_explorer",
    "src/infinitier_keeper",
    "src/infinitier_keeper_xilem",
    "src/xilem_components",
    "src/fs",
    "src/test_utils",
    "src/resources/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.8"
license = "GPL-3.0-or-later"
authors = ["Francesco Cina <ufoscout@gmail.com>"]
homepage = "https://github.com/ufoscout/infinitier"
repository = "https://github.com/ufoscout/infinitier"

[workspace.dependencies]
# Codecs
infinitier_acm_decoder = { path = "src/codecs/acm_decoder", version = "0.0.8" }
infinitier_acm_encoder = { path = "src/codecs/acm_encoder", version = "0.0.8"  }
infinitier_bik_decoder = { path = "src/codecs/bik_decoder", version = "0.0.8"  }
infinitier_mve_decoder = { path = "src/codecs/mve_decoder", version = "0.0.8"  }
infinitier_mve_encoder = { path = "src/codecs/mve_encoder", version = "0.0.8"  }
infinitier_wbm_decoder = { path = "src/codecs/wbm_decoder", version = "0.0.8"  }

# Core
infinitier_common = { path = "src/common", version = "0.0.8" }
infinitier_core = { path = "src/core", version = "0.0.8"  }
infinitier_datasource = { path = "src/datasource", version = "0.0.8"  }
infinitier_egui_common = { path = "src/egui_common", version = "0.0.8" }
infinitier_fs = { path = "src/fs", version = "0.0.8"  }
infinitier_keeper = { path = "src/infinitier_keeper", version = "0.0.8"  }
infinitier_test_utils = { path = "src/test_utils" }

# Resources
infinitier_acm_resource = { path = "src/resources/acm", version = "0.0.8"  }
infinitier_bam_resource = { path = "src/resources/bam", version = "0.0.8"  }
infinitier_bcs_resource = { path = "src/resources/bcs", version = "0.0.8"  }
infinitier_bif_resource = { path = "src/resources/bif", version = "0.0.8"  }
infinitier_bmp_resource = { path = "src/resources/bmp", version = "0.0.8"  }
infinitier_cre_resource = { path = "src/resources/cre", version = "0.0.8"  }
infinitier_fnt_resource = { path = "src/resources/fnt", version = "0.0.8"  }
infinitier_gam_resource = { path = "src/resources/gam", version = "0.0.8"  }
infinitier_ids_resource = { path = "src/resources/ids", version = "0.0.8"  }
infinitier_ini_resource = { path = "src/resources/ini", version = "0.0.8"  }
infinitier_itm_resource = { path = "src/resources/itm", version = "0.0.8"  }
infinitier_key_resource = { path = "src/resources/key", version = "0.0.8"  }
infinitier_mos_resource = { path = "src/resources/mos", version = "0.0.8"  }
infinitier_png_resource = { path = "src/resources/png", version = "0.0.8"  }
infinitier_pvrz_resource = { path = "src/resources/pvrz", version = "0.0.8"  }
infinitier_sav_resource = { path = "src/resources/sav", version = "0.0.8"  }
infinitier_spl_resource = { path = "src/resources/spl", version = "0.0.8"  }
infinitier_tis_resource = { path = "src/resources/tis", version = "0.0.8"  }
infinitier_tlk_resource = { path = "src/resources/tlk", version = "0.0.8"  }
infinitier_ttf_resource = { path = "src/resources/ttf", version = "0.0.8"  }
infinitier_two_da_resource = { path = "src/resources/two_da", version = "0.0.8"  }
infinitier_wav_resource = { path = "src/resources/wav", version = "0.0.8"  }
infinitier_wed_resource = { path = "src/resources/wed", version = "0.0.8"  }

bitflags = { version = "2", features = ["serde"] }
bytesize = "2"
clap = { version = "4", features = ["derive"] }
# Pure-Rust NeuQuant color quantizer. Used by the MOS V1 exporter to
# build a 256-entry palette per 64×64 block when converting an arbitrary
# RGBA image to MOS V1 (each block carries its own palette on disk).
color_quant = "2"
encoding_rs = "0.8"
env_logger = "0.11"
flate2 = "1"
hound = "3"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
itertools = "0.14"
log = "0.4"
parking_lot = "0.12"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis"] }
tempfile = "3"
thiserror = "2"

# This is used to decode DDS image content into the PVR files.
# We can switch to image-extras when this PR is merged: https://github.com/image-rs/image-extras/pull/16
texture2ddecoder = "0.1"

# BC1/BC3 (DXT1/DXT5) encoder used to write PVR files back from a decoded
# ImageBuffer. Pure Rust port of libsquish.
texpresso = "2"

# Pure-Rust TrueType / OpenType parser. Used by the TTF resource importer
# to extract `name` / `head` / `hhea` metadata; sample-text rendering in
# the viewer goes through egui's text renderer instead.
ttf-parser = "0.25"

# Audio playback
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3"] }

# WBM (= WebM) decode pipeline. See src/codecs/wbm_decoder.
matroska-demuxer = "0.7"
oxideav-vp8 = "0.1"
oxideav-core = "0.1"

# egui UI
# `default-features = false` drops eframe's `accesskit` feature which clashes with Xilem.
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }
egui_extras = "0.34"   # extra widgets: tables, date pickers, image loading
egui_ltreeview = "0.7"
egui-components = { git = "https://github.com/ufoscout/egui-components", branch = "main" }
# Bundles the Inter typeface (OFL-1.1, https://rsms.me/inter) as a
# `pub const REGULAR: &[u8]`. The active weight is selected via the
# crate's Cargo features (`regular`, `bold`, `medium`, …) — only
# one may be enabled at a time; the constant name stays the same.
ttf-inter = { version = "0.1", default-features = false, features = ["regular"] }

# Xilem UI
xilem = { git = "https://github.com/linebender/xilem", branch = "main" }
xilem_components = { path = "src/xilem_components", version = "0.0.8" }


[profile.dev]
debug = "line-tables-only"

# Set the settings for all dependencies (but not this crate itself or any workspace member).
# This includes build dependencies.
# Level range is from 0 (default for dev) to 3 (default for release)
[profile.dev.package."*"]
opt-level = 2

# Set the settings for build scripts and proc-macros.
[profile.dev.build-override]
opt-level = 2

# Workspace-member overrides: the `"*"` glob above does *not* match
# workspace members, so the codec crates would otherwise build at
# opt-level 0 in dev/test mode. Encoding/decoding is hot CPU code
# (per-pixel loops, motion search) and is unusably slow unoptimised,
# so force opt-level 2 here. List per crate — Cargo has no glob
# selector for workspace members.
[profile.dev.package.infinitier_acm_decoder]
opt-level = 2
[profile.dev.package.infinitier_acm_encoder]
opt-level = 2
[profile.dev.package.infinitier_bik_decoder]
opt-level = 2
[profile.dev.package.infinitier_mve_decoder]
opt-level = 2
[profile.dev.package.infinitier_mve_encoder]
opt-level = 2
[profile.dev.package.infinitier_wbm_decoder]
opt-level = 2


