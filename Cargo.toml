[workspace]
members = [
    "src/codecs/*",
    "src/core",
    "src/datasource",
    "src/egui",
    "src/fs",
    "src/test_utils",
    "src/importers/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Francesco Cina <ufoscout@gmail.com>"]
homepage = "https://github.com/ufoscout/infinitier"
repository = "https://github.com/ufoscout/infinitier"

[workspace.dependencies]
# Codecs
infinitier_acm_decoder = { path = "src/codecs/acm_decoder" }
infinitier_mve_decoder = { path = "src/codecs/mve_decoder" }

# Core
infinitier_core = { path = "src/core" }
infinitier_datasource = { path = "src/datasource" }
infinitier_fs = { path = "src/fs" }
infinitier_test_utils = { path = "src/test_utils" }

# Importers
infinitier_bam_importer = { path = "src/importers/bam_importer" }
infinitier_bif_importer = { path = "src/importers/bif_importer" }
infinitier_bmp_importer = { path = "src/importers/bmp_importer" }
infinitier_ids_importer = { path = "src/importers/ids_importer" }
infinitier_key_importer = { path = "src/importers/key_importer" }
infinitier_pvr_importer = { path = "src/importers/pvr_importer" }
infinitier_two_da_importer = { path = "src/importers/two_da_importer" }
infinitier_wed_importer = { path = "src/importers/wed_importer" }

bitflags = { version = "2", features = ["serde"] }
encoding_rs = "0.8"
flate2 = "1"
hound = "3"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
itertools = "0.14"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

# This is used to decode DDS image content into the PVR files.
# We can switch to image-extras when this PR is merged: https://github.com/image-rs/image-extras/pull/16
texture2ddecoder = "0.1"


[profile.dev]
debug = "line-tables-only"

# Set the settings for all dependencies (but not this crate itself or any workspace member).
# This includes build dependencies.
# Level range is from 0 (default for dev) to 3 (default for release)
[profile.dev.package."*"]
opt-level = 2

# Set the settings for build scripts and proc-macros.
[profile.dev.build-override]
opt-level = 2
