name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # Use older glibc to support most distros
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin   # Apple Silicon
          - os: macos-13
            target: x86_64-apple-darwin     # Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so `git describe` resolves the release tag

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: infinitier_explorer,infinitier_keeper
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix       # .tar.gz on Linux/macOS
          zip: windows    # .zip on Windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
