[package]
name = "infinitier_acm_resource"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Importer for the ACM sound resources used in Infinity Engine games (real ACM + EE Ogg-as-ACM)"
readme = "readme.md"
keywords = ["acm", "ogg", "audio", "infinity-engine", "baldurs-gate"]

[dependencies]
infinitier_acm_decoder = { workspace = true }
infinitier_datasource = { workspace = true }
# The OGG-pretending-to-be-ACM branch delegates to WavDecoder, which
# already wires up Symphonia for OGG. Avoids duplicating that plumbing
# (and the symphonia / thiserror deps it pulls).
infinitier_wav_resource = { workspace = true }
log = { workspace = true }

[dev-dependencies]
infinitier_test_utils = { workspace = true }
sha2 = { workspace = true }
