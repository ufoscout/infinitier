[package]
name = "infinitier_keeper_slint"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Cross-engine save-game editor for Infinity Engine games (BG, BG:EE, BG2, BG2:EE, IWD, IWD:EE, IWD2, PST, PST:EE)"
readme = "readme.md"
keywords = ["save-game", "editor", "infinity-engine", "baldurs-gate", "gui"]


[dependencies]
# Path dep into the main workspace's core crate. Its own deps still
# resolve via the main workspace's `[workspace.dependencies]` table.
infinitier_core = { path = "../core" }

clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

slint = { version = "1.16" }

[build-dependencies]
slint-build = "1.16"
