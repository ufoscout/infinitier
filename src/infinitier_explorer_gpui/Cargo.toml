[package]
name = "infinitier_explorer_gpui"
version = "0.0.5"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Francesco Cina <ufoscout@gmail.com>"]
homepage = "https://github.com/ufoscout/infinitier"
repository = "https://github.com/ufoscout/infinitier"
description = "GPUI / gpui-component port of the Infinitier resource explorer."
readme = "readme.md"
keywords = ["infinity-engine", "baldurs-gate", "explorer", "gui"]
publish = false

[dependencies]
# Path dep into the main workspace's core crate. Its own deps still
# resolve via the main workspace's `[workspace.dependencies]` table.
infinitier_core = { path = "../core" }

bytesize = "2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
# Same major version gpui uses; we need it for `image::Frame`, the
# wrapper that `gpui::RenderImage::new` consumes. The `ImageBuffer`
# already comes through from `infinitier_core` so we don't need codec
# features here.
image = { version = "0.25", default-features = false }
smallvec = "1"
# Audio backend the sound + movie viewers stream into. Matches the
# workspace dep set; symphonia-mp3 is enabled for parity with the egui
# viewers (some MVE files carry mp3 audio).
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3"] }

gpui = "0.2"
gpui-component = "0.5"
